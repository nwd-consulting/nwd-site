# Re-upload the sandbox preview when someone pushes to a PR branch by hand. (Pushes the
# agent workflow makes with GITHUB_TOKEN do not trigger workflows, so agent.yml uploads
# its own first preview.)

name: Preview

on:
  pull_request:
    branches: [ai-main, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload
        id: up
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm ci --silent
          npx wrangler d1 migrations apply nwd-blog-preview --env preview --remote
          out=$(npx wrangler versions upload --env preview --preview-alias "pr-${{ github.event.number }}" 2>&1)
          echo "$out"
          echo "url=$(echo "$out" | grep -o 'Version Preview Alias URL: https://[^ ]*' | sed 's/.*URL: //')" >> "$GITHUB_OUTPUT"
      - name: Comment
        if: github.event.action == 'opened' && steps.up.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.number }} --body "Sandbox preview: ${{ steps.up.outputs.url }}"
