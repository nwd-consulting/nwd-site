name: Lint

# Every check in scripts/lint.py corresponds to a bug that shipped or nearly shipped,
# so this is a regression suite rather than style enforcement.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static checks
        run: python3 scripts/lint.py

      - name: Serve public/ and fetch every page and asset
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory public &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/ && break
            sleep 1
          done
          python3 scripts/check_served.py http://127.0.0.1:8000

      - name: Worker bundles
        run: |
          npm ci --silent
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle"
